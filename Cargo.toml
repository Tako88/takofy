[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# The floor is the compiler the Flatpak SDK ships, so the release and the
# sandbox are built by the same rustc.
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# librespot 0.8.0's build script does not compile against current vergen. The fix
# is a Cargo.lock pin to vergen 9.0.6, which `cargo update` undoes — re-run
# `cargo update -p vergen --precise 9.0.6` if the build breaks.
#
# rustls over native-tls and no mdns: Windows needs no OpenSSL, and the receiver
# announces itself through the account's device list rather than on the network.
librespot = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
    "rodio-backend",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
keyring = "4.2.0"
env_logger = "0.11"
log = "0.4"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
# Only tests build raw dealer payloads; librespot already locks the same version.
serde_json = "1"
futures-util = "0.3"
# The collection endpoints want their own media type and an HTTP method, and
# hyper does not re-export either; `http` is the same 1.5.0 librespot has locked.
http = "1"
# The local hour for Home's greeting. Already in the build through `oauth2`, and
# `unsafe_code` is denied, so a hand-written `localtime` is out.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The window: eframe runs the event loop and egui draws each frame.
#
# Glow (OpenGL), not wgpu. wgpu 30 does not compile for Windows: wgpu-hal 30
# wants the `windows` 0.62 bindings and its gpu-allocator 0.28 dependency still
# wants 0.61, so the D3D12 backend fails on mismatched types. The UI is 2D and
# draws through egui either way, so the smaller backend costs nothing and is the
# one that builds everywhere we ship.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37.0"
# Cover art: `image` decodes JPEG under explicit limits, and the one PNG is the
# window icon at startup; `reqwest` fetches the public CDN URL with a timeout and
# a cancellable request.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Build-time only: the resource compiler that embeds the window icon on
# Windows. Linux never runs the script.
winresource = "0.1.34"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
