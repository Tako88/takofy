[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# The pin that matters is in Cargo.lock, not here. librespot 0.8.0's build script
# uses vergen-gitcl 1.0.8, which no longer agrees with vergen 9.1.0's vergen-lib,
# so librespot-core fails to build a build script. librespot's `dev` branch
# carries the same fix (vergen =9.0.6). A plain `cargo update` undoes it; re-run
# `cargo update -p vergen --precise 9.0.6` if the workspace stops building.
#
# rustls over native-tls and no mdns: Windows then needs no OpenSSL, and a
# Spotify Connect receiver is not something phase 1 asks for.
librespot = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
    "rodio-backend",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
eframe = "0.37.0"
egui = "0.37.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
