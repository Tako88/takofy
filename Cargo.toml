[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# librespot 0.8.0's build script does not compile against current vergen. The fix
# is a Cargo.lock pin to vergen 9.0.6, which `cargo update` undoes — re-run
# `cargo update -p vergen --precise 9.0.6` if the build breaks.
#
# rustls over native-tls and no mdns: Windows needs no OpenSSL, and nothing here
# is a Spotify Connect receiver.
librespot = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
    "rodio-backend",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
keyring = "4.2.0"
env_logger = "0.11"
log = "0.4"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
futures-util = "0.3"
# The window: eframe runs the event loop and egui draws each frame.
eframe = "0.37.0"
egui = "0.37.0"
# Cover art: `image` decodes JPEG under explicit limits; `reqwest` fetches the
# public CDN URL with a timeout and a cancellable request.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
