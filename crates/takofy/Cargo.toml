[package]
name = "takofy"
description = "A fast, lean Spotify client for Windows and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
takofy-core = { path = "../takofy-core" }
takofy-model = { path = "../takofy-model" }
takofy-ui = { path = "../takofy-ui" }
librespot.workspace = true
keyring.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true
image.workspace = true
reqwest.workspace = true

[lints]
workspace = true

[build-dependencies]
# Finds Windows' own resource compiler, which is the awkward half of embedding
# an icon; the script does nothing unless the target is Windows.
winresource = "0.1.34"
